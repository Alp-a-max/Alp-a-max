name: Profile metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AniList watching and reading lists
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ github.token }}
          committer_branch: main
          user: Alp-a-max
          filename: metrics.plugin.anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: judexindex
          plugin_anilist_medias: anime,manga
          plugin_anilist_sections: watching,reading
          plugin_anilist_limit: 4
          plugin_anilist_shuffle: no

      - name: Generate starred topics with icons
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ github.token }}
          committer_branch: main
          user: Alp-a-max
          filename: metrics.plugin.topics.icons.svg
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

      - name: Generate starred topics with labels
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ github.token }}
          committer_branch: main
          user: Alp-a-max
          filename: metrics.plugin.topics.svg
          base: ""
          plugin_topics: yes
          plugin_topics_mode: labels
          plugin_topics_limit: 12
